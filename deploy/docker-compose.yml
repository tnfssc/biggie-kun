services:
  biggie-kun:
    build:
      context: ..
      dockerfile: Dockerfile
    image: biggie-kun:local
    restart: unless-stopped
    # Context lives in RAM only — no document/index volume mounts.
    tmpfs:
      - /tmp:size=64m,mode=1777
    read_only: true
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      BIGGIE_MODEL: ${BIGGIE_MODEL:-qwen3.5:4b}
      BIGGIE_MAX_REQUEST_BYTES: ${BIGGIE_MAX_REQUEST_BYTES:-4100000000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - serve
      - --listen
      - 0.0.0.0
      - --port
      - "11500"
      - --ollama-host
      - ${OLLAMA_HOST:-http://host.docker.internal:11434}
      - --model
      - ${BIGGIE_MODEL:-qwen3.5:4b}
    healthcheck:
      test: ["CMD", "/usr/local/bin/biggie-kun", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  cloudflared:
    # Public hostname should target http://biggie-kun:11500
    image: cloudflare/cloudflared@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN:?set CLOUDFLARED_TUNNEL_TOKEN in .env}
    restart: unless-stopped
    depends_on:
      biggie-kun:
        condition: service_healthy
